<rect x="750" y="212" width="210" height="64" rx="12" class="box"/><text x="768" y="242" class="t">Pen layer</text><text x="768" y="265" class="s">circles, arrows, notes</text>
<rect x="750" y="304" width="210" height="72" rx="12" class="box"/><text x="768" y="334" class="t">Clicks + typing</text><text x="768" y="357" class="s">by control name</text>
