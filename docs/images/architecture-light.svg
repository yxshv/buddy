<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa1b4"/></marker></defs>
<style>.box{fill:#f6f7fb;stroke:#d5d9e6;stroke-width:1.2}.hot{fill:#eef0ff;stroke:#6c6cf0;stroke-width:1.6}.safe{fill:#fff4ea;stroke:#e08a3c;stroke-width:1.6}
.t{fill:#1d2133;font-size:17px;font-weight:600}.s{fill:#5b6275;font-size:14px}.h{fill:#8a91a6;font-size:12px;font-weight:700;letter-spacing:1.5px}.ln{stroke:#9aa1b4;stroke-width:1.8;fill:none}</style>

<text x="24" y="38" class="h">YOU SAY AND SEE</text><text x="270" y="38" class="h">BUDDY (ON YOUR MAC)</text><text x="752" y="38" class="h">YOU GET</text>
<rect x="20" y="56" width="220" height="72" rx="12" class="box"/><text x="38" y="86" class="t">“Hey Buddy, …”</text><text x="38" y="109" class="s">your voice</text>
<rect x="20" y="180" width="220" height="72" rx="12" class="box"/><text x="38" y="210" class="t">Your screen</text><text x="38" y="233" class="s">screenshot + its controls</text>
<rect x="270" y="56" width="200" height="72" rx="12" class="box"/><text x="288" y="86" class="t">Ears</text><text x="288" y="109" class="s">wake word + Whisper</text>
<rect x="270" y="180" width="440" height="92" rx="12" class="hot"/><text x="288" y="210" class="t">Claude Code</text><text x="288" y="233" class="s">your subscription; MCP connectors,</text>
<text x="288" y="256" class="s">files, shell, web, memory, your shortcuts</text>
<rect x="270" y="304" width="440" height="72" rx="12" class="safe"/><text x="288" y="334" class="t">Needs your OK</text><text x="288" y="357" class="s">Touch ID before risky actions</text>
