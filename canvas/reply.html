<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="text.css">
<style>
  /* The chat in Buddy's panel: transparent over the panel's frosted material. */
  :root {
    --ink: rgba(0, 0, 0, 0.86);
    --muted: rgba(0, 0, 0, 0.5);
    --rule: rgba(0, 0, 0, 0.1);
    --code-bg: rgba(0, 0, 0, 0.06);
    --sheet: rgba(255, 255, 255, 0.5);
    --sheet-edge: rgba(0, 0, 0, 0.07);
    --bubble: rgba(0, 0, 0, 0.07);
    --c: #0A84FF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.55);
      --rule: rgba(255, 255, 255, 0.12);
      --code-bg: rgba(255, 255, 255, 0.1);
      --sheet: rgba(255, 255, 255, 0.06);
      --sheet-edge: rgba(255, 255, 255, 0.08);
      --bubble: rgba(255, 255, 255, 0.1);
    }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    font: 15px/1.45 -apple-system, system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    cursor: default;
    user-select: none;
  }
  #scroll { position: relative; height: 100%; overflow-y: auto; overscroll-behavior: contain; }
  /* More above or below: fade that edge instead of cutting the text off. */
  #scroll.below { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); }
  #scroll.above { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 28px); }
  #scroll.above.below { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 28px, #000 calc(100% - 36px), transparent); }
  #thread { padding-bottom: 2px; }
  .turn { animation: rise 260ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  .turn + .turn { margin-top: 18px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* What you said, as a bubble on the right. */
  .q { display: flex; justify-content: flex-end; }
  .q span {
    max-width: 86%;
    padding: 6px 12px 7px;
    border-radius: 16px;
    background: var(--bubble);
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .q:not([hidden]) + .a, .q:not([hidden]) ~ .sheet, .a:not([hidden]) + .sheet { margin-top: 10px; }
  /* Cards sit 10px below whatever comes before them in the turn (your bubble, the answer, the sheet). */
  .turn > :not([hidden]) ~ .cards > .rcards { margin-top: 10px; }
  .a p { margin: 0 0 0.5em; }
  .sheet {
    padding: 14px 16px 16px;
    border-radius: 14px;
    background: var(--sheet);
    border: 0.5px solid var(--sheet-edge);
    font-size: 14.5px;
    line-height: 1.5;
  }
  /* More of the answer arrived below while you were reading above. */
  #latest {
    position: fixed; left: 50%; bottom: 8px; transform: translate(-50%, 6px);
    height: 24px; padding: 0 10px; border: 0; border-radius: 12px;
    background: var(--c); color: #fff; font: 600 11.5px -apple-system, system-ui, sans-serif;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    opacity: 0; pointer-events: none; transition: opacity 160ms ease, transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  #latest.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .turn { animation: none; } #latest { transition: opacity 120ms ease; transform: translate(-50%, 0); } }
  [hidden] { display: none !important; }
</style>
<script src="katex/katex.min.js"></script>
<script src="markdown.js"></script>
<script src="cards.js"></script>
</head>
<body>
<div id="scroll"><div id="thread"></div></div>
<button id="latest">↓ Latest</button>
<script>
(() => {
  const { markdown } = window.BuddyMarkdown;
  const scroll = document.getElementById("scroll");
  const thread = document.getElementById("thread");
  const post = (m) => window.webkit?.messageHandlers?.buddy?.postMessage(m);
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  const rows = [];
  let anchor = null; // the newest turn, kept at the top of the view until you scroll yourself
  let released = false; // you scrolled: stay where you are until the next turn starts

  // Writes a write-up in block by block, faster when there's a lot of it.
  function write(sheet, text) {
    sheet.textContent = "";
    const blocks = markdown(text);
    const total = blocks.reduce((n, b) => n + b.replace(/<[^>]+>/g, "").length, 0);
    const speed = clamp(total / 3500, 0.25, 1);
    let t = 80;
    for (const html of blocks) {
      const b = document.createElement("div");
      b.className = "blk";
      b.innerHTML = html;
      const dur = clamp((140 + b.textContent.length * 8) * (1.1 - speed * 0.6), 160, 700);
      b.style.setProperty("--delay", `${t}ms`);
      b.style.setProperty("--dur", `${dur}ms`);
      sheet.appendChild(b);
      t += dur * 0.6;
    }
  }

  function makeRow() {
    const el = document.createElement("div");
    el.className = "turn";
    el.innerHTML = '<div class="q" hidden><span></span></div><div class="a md" hidden></div><div class="md sheet" hidden></div><div class="cards"></div>';
    return { el, q: el.children[0], a: el.children[1], sheet: el.children[2], cards: el.children[3], state: { q: null, a: null, b: null, c: "" } };
  }

  const latest = document.getElementById("latest");
  let lastHeight = 0;
  function edges() {
    const below = scroll.scrollTop + scroll.clientHeight < scroll.scrollHeight - 4;
    scroll.classList.toggle("above", scroll.scrollTop > 4);
    scroll.classList.toggle("below", below);
    // You let go of the newest turn and it kept growing: offer a way back.
    if (!below) latest.classList.remove("show");
    else if (!anchor && scroll.scrollHeight > lastHeight + 2 && lastHeight > 0) latest.classList.add("show");
    lastHeight = scroll.scrollHeight;
  }
  latest.addEventListener("mouseup", (e) => e.stopPropagation()); // not a click on the panel
  // Down to the newest words (not back up to the start of the answer); you stay in charge of scrolling.
  latest.addEventListener("click", () => {
    latest.classList.remove("show");
    scroll.scrollTo({ top: scroll.scrollHeight, behavior: "smooth" });
  });

  function follow(smooth) {
    if (!anchor) return;
    const top = Math.min(anchor.offsetTop - 2, scroll.scrollHeight - scroll.clientHeight);
    if (Math.abs(scroll.scrollTop - top) > 1) scroll.scrollTo({ top, behavior: smooth ? "smooth" : "instant" });
  }

  window.chat = {
    // turns: [{question, answer, board}], oldest first.
    set(turns) {
      while (rows.length > turns.length) {
        const gone = rows.pop();
        if (anchor === gone.el) anchor = null;
        gone.el.remove();
      }
      let added = false;
      turns.forEach((t, i) => {
        let r = rows[i];
        if (!r) { r = makeRow(); rows.push(r); thread.appendChild(r.el); added = true; }
        const s = r.state;
        if (s.q !== t.question) {
          s.q = t.question;
          r.q.firstChild.textContent = t.question;
          r.q.hidden = !t.question;
        }
        if (s.a !== t.answer) {
          s.a = t.answer;
          r.a.innerHTML = t.answer ? markdown(t.answer).join("") : "";
          r.a.hidden = !t.answer;
        }
        const cards = JSON.stringify(t.cards || []);
        if (s.c !== cards) {
          s.c = cards;
          r.cards.innerHTML = window.BuddyCards.html(t.cards);
        }
        if (s.b !== t.board) {
          s.b = t.board;
          r.sheet.hidden = !t.board;
          if (t.board) write(r.sheet, t.board); else r.sheet.textContent = "";
        }
      });
      if (added) released = false;
      if (added || (!anchor && !released)) anchor = rows[rows.length - 1]?.el || null;
      follow(added && rows.length > 1);
      edges();
    },
  };

  new ResizeObserver(() => {
    post({ height: Math.ceil(thread.getBoundingClientRect().height) });
    follow(false);
    edges();
  }).observe(thread);
  new ResizeObserver(() => { follow(false); edges(); }).observe(scroll);
  scroll.addEventListener("scroll", edges, { passive: true });
  // Scrolling yourself lets go of the newest turn until the next one arrives.
  scroll.addEventListener("wheel", () => { anchor = null; released = true; }, { passive: true });

  // A click (not a drag on the scroller) opens the chats window.
  let down = null;
  addEventListener("mousedown", (e) => { down = [e.clientX, e.clientY]; });
  addEventListener("mouseup", (e) => {
    // A click on a result card opens that card instead (cards.js).
    if (down && !e.target.closest?.(".rcard, #latest") && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 5 && e.clientX < scroll.clientWidth) post("open");
    down = null;
  });

  post("ready");
})();
</script>
</body>
</html>
